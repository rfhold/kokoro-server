apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: kokoro-service-agent-gateway
  labels:
    app: kokoro-service
spec:
  hostnames:
    - agent-gateway.holdenitdown.net
  parentRefs:
    - group: gateway.networking.k8s.io
      kind: Gateway
      name: agentgateway-proxy
      namespace: agentgateway-system
  rules:
    - matches:
        - method: POST
          path:
            type: Exact
            value: /v1/audio/speech
      backendRefs:
        - kind: Service
          name: kokoro-service
          port: 8000
      timeouts:
        request: 60s
