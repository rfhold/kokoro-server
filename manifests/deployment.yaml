apiVersion: apps/v1
kind: Deployment
metadata:
  name: kokoro-service
spec:
  replicas: 0
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: kokoro-service
  template:
    metadata:
      labels:
        app: kokoro-service
    spec:
      nodeSelector:
        kubernetes.io/arch: amd64
        kubernetes.io/hostname: athena
        rholden.dev/gpu: cuda
      runtimeClassName: nvidia
      tolerations:
        - key: workload-type
          operator: Equal
          value: gpu-inference
          effect: NoSchedule
      containers:
        - name: kokoro-service
          image: cr.holdenitdown.net/rfhold/kokoro-service:cuda-amd64
          imagePullPolicy: Always
          securityContext:
            runAsNonRoot: true
            runAsUser: 65532
            runAsGroup: 65532
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: false
            capabilities:
              drop:
                - ALL
          ports:
            - name: http
              containerPort: 8000
          envFrom:
            - configMapRef:
                name: kokoro-config
          env:
            - name: EXECUTOR_WORKERS
              value: "1"
            - name: OTEL_EXPORTER_OTLP_ENDPOINT
              value: https://telemetry.holdenitdown.net:4317
            - name: OTEL_EXPORTER_OTLP_PROTOCOL
              value: grpc
            - name: OTEL_SERVICE_NAME
              value: kokoro-service
          resources:
            requests:
              memory: 1Gi
              cpu: "1"
            limits:
              memory: 4Gi
              cpu: "4"
          volumeMounts:
            - name: model-cache
              mountPath: /home/nonroot/.cache/huggingface
          startupProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 30
            periodSeconds: 10
            timeoutSeconds: 10
            failureThreshold: 30
          livenessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 60
            periodSeconds: 30
            timeoutSeconds: 10
          readinessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 10
            periodSeconds: 10
      volumes:
        - name: model-cache
          persistentVolumeClaim:
            claimName: kokoro-model-cache
